name: 주식 일일 시황 카톡 발송

# 2026-08-26: schedule 트리거가 매일 3시간10~30분 지연되는 게 확인되어(00:05 UTC 기준),
# 관측된 평균 지연(~3시간20분)만큼 앞당겨서 실제 도착이 09:00 KST 근처가 되도록 조정.
# 지연 패턴이 바뀌면 이 시각도 재조정이 필요할 수 있음.
on:
  schedule:
    - cron: "42 20 * * *"  # 20:42 UTC = 05:42 KST (지연 감안, 목표 실제 도착 09:00 KST 근처)
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
