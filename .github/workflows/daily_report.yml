name: 주식 일일 시황 웹페이지 갱신

# 2026-08-27: 목표 도착 시각을 09:00 KST -> 07:30 KST로 변경. 관측된 평균 지연
# (~3시간20분)을 반영해 트리거를 19:10 UTC로 역산. cron 문자열을 바꿀 때마다
# GitHub 쪽 재등록에 시간이 걸리는 패턴이 반복 확인되어, 이번에도 며칠간 공백이
# 있을 수 있음.
on:
  schedule:
    - cron: "10 19 * * *"  # 19:10 UTC = 04:10 KST (지연 감안, 목표 실제 도착 07:30 KST 근처)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish web page
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Update daily report page"
          git push
