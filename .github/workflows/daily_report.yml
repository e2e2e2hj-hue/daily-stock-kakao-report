name: 주식 일일 시황 카톡 발송

# 2026-08-27: "42 20 * * *"로 바꾼 뒤 이틀 연속 스케줄이 한 번도 발동하지 않았음
# (schedule 트리거는 cron 문자열을 바꿀 때마다 GitHub 쪽에서 재등록에 시간이 걸리는
# 것으로 추정). 시각을 한 번 더 조정하지만, 이 변경 자체가 또 며칠간의 공백을
# 유발할 수 있다는 점을 감안할 것. 목표는 여전히 실제 도착 09:00 KST 근처.
on:
  schedule:
    - cron: "51 20 * * *"  # 20:51 UTC = 05:51 KST
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
